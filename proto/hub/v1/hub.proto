syntax = "proto3";

// Package hub.v1 is the host<->hub + api<->webapp Connect wire contract for the
// sprawl hub (see docs/designs/hub/03-api-surfaces.md).
//
// ADDITIVE-ONLY FIELD POLICY (see proto/README.md): fields may only be ADDED
// with new numbers. NEVER renumber a field, NEVER change a field's type, and
// NEVER reuse a retired field number — `reserve` it instead. The `buf breaking`
// gate in `make validate` (baseline: main HEAD) enforces this so an old host or
// a stale browser tab keeps talking to a new hub.
package hub.v1;

option go_package = "github.com/dmotles/sprawl/internal/hub/gen/hub/v1;hubv1";

// RegisterInstanceRequest announces a host to the hub. Idempotent upsert of the
// instance row, keyed by host_id. Called on connect.
message RegisterInstanceRequest {
  string host_id = 1;
  string run_id = 2;
  string repo_label = 3;
  string user_id = 4;
}

// RegisterInstanceResponse is intentionally minimal this slice; fields are added
// additively as the registry gains meaning (P0-3).
message RegisterInstanceResponse {}

// ListInstancesRequest enumerates connected instances. No filters this slice.
message ListInstancesRequest {}

// Instance is one connected host as seen by the hub.
message Instance {
  string host_id = 1;
  string repo_label = 2;
  // active marks the advisory active-host for its project (docs 01 §4).
  bool active = 3;
  int32 clients_connected = 4;
  int64 last_seen_unix_ms = 5;
}

// ListInstancesResponse returns the current set of connected instances.
message ListInstancesResponse {
  repeated Instance instances = 1;
}

// CreateHostTokenRequest mints a new host bearer token. This is a browser-only
// (cookie-authenticated) operator action; hosts must not mint tokens.
message CreateHostTokenRequest {
  string label = 1;
}

// CreateHostTokenResponse returns the plaintext token EXACTLY ONCE plus its id.
// The plaintext is never persisted and cannot be re-derived; the server stores
// only a sealed hash.
message CreateHostTokenResponse {
  string token = 1; // full plaintext sprawl_hub_<id>_<secret>; shown once
  string token_id = 2;
}

// ListHostTokensRequest enumerates the caller's host tokens. No filters.
message ListHostTokensRequest {}

// HostToken is one token row as metadata ONLY — never the secret, hash, or
// plaintext.
message HostToken {
  string token_id = 1;
  string label = 2;
  int64 created_at_unix_ms = 3;
  int64 revoked_at_unix_ms = 4; // 0 == active
}

// ListHostTokensResponse returns the caller's tokens (active and revoked).
message ListHostTokensResponse {
  repeated HostToken tokens = 1;
}

// RevokeHostTokenRequest revokes a token by its non-secret token id.
message RevokeHostTokenRequest {
  string token_id = 1;
}

// RevokeHostTokenResponse is intentionally empty.
message RevokeHostTokenResponse {}

// WireDirection is the transport direction of a captured wire-log frame,
// carried verbatim from the QUM-902 envelope `dir` field: IN = host -> claude
// stdin, OUT = claude stdout -> host.
enum WireDirection {
  WIRE_DIRECTION_UNSPECIFIED = 0;
  WIRE_DIRECTION_IN = 1;
  WIRE_DIRECTION_OUT = 2;
}

// WireFrameKind distinguishes a real captured DATA frame from a server-injected
// keep-alive HEARTBEAT on the subscribe stream. Heartbeats carry no raw payload
// and a zero seq; they exist only to hold the L7 connection open (QUM-871).
enum WireFrameKind {
  WIRE_FRAME_KIND_UNSPECIFIED = 0;
  WIRE_FRAME_KIND_DATA = 1;
  WIRE_FRAME_KIND_HEARTBEAT = 2;
}

// WireFrame is one seq'd wire-log entry. seq is the QUM-902 monotonic counter,
// carried VERBATIM end to end and NEVER renumbered by the hub. raw is the
// captured protocol frame exactly as written to the wire log.
message WireFrame {
  int64 seq = 1;
  WireDirection direction = 2;
  WireFrameKind kind = 3;
  string raw = 4;
  int64 ts_unix_ms = 5;
}

// PushWireLogRequest is the host->hub uplink: a batch of captured frames for one
// (host_id, run_id, session_id). from_seq is the resume hint — the seq this
// batch continues from, so a contiguous batch has frames[0].seq == from_seq + 1
// and the hub can detect a gap. On a fresh run from_seq = 0.
message PushWireLogRequest {
  string host_id = 1;
  string run_id = 2;
  string session_id = 3;
  repeated WireFrame frames = 4;
  int64 from_seq = 5;
}

// PushWireLogResponse acks ingest. Intentionally minimal this slice; fields are
// added additively (e.g. an accepted-through seq) as ingest gains meaning.
message PushWireLogResponse {}

// SubscribeWireLogRequest opens the browser->hub downlink for one instance's
// wire log. from_seq = 0 => full replay from the beginning; on reconnect the
// client passes the last seq it saw and the server resumes at from_seq + 1
// (zero gaps, zero dupes), then live-tails with periodic heartbeat frames.
message SubscribeWireLogRequest {
  string host_id = 1;
  string run_id = 2;
  string session_id = 3;
  int64 from_seq = 4;
}

// SubscribeWireLogResponse is one item on the server stream: exactly one frame
// (DATA or HEARTBEAT). Wrapping the frame satisfies buf's response-naming rule
// and leaves room for additive stream-level metadata later.
message SubscribeWireLogResponse {
  WireFrame frame = 1;
}

// HubService is the RPC surface for the hub. RegisterInstance/ListInstances are
// the host<->hub registry RPCs; the CreateHostToken/ListHostTokens/
// RevokeHostToken RPCs are browser-only (cookie-authenticated) token
// administration (docs/designs/hub/04-authentication.md §4).
service HubService {
  rpc RegisterInstance(RegisterInstanceRequest) returns (RegisterInstanceResponse) {}
  rpc ListInstances(ListInstancesRequest) returns (ListInstancesResponse) {}
  rpc CreateHostToken(CreateHostTokenRequest) returns (CreateHostTokenResponse) {}
  rpc ListHostTokens(ListHostTokensRequest) returns (ListHostTokensResponse) {}
  rpc RevokeHostToken(RevokeHostTokenRequest) returns (RevokeHostTokenResponse) {}
  // PushWireLog is the host->hub uplink for batches of seq'd wire-log frames.
  rpc PushWireLog(PushWireLogRequest) returns (PushWireLogResponse) {}
  // SubscribeWireLog is the browser->hub server-stream downlink: full replay
  // from from_seq then live-tail, with heartbeat frames on-stream.
  rpc SubscribeWireLog(SubscribeWireLogRequest) returns (stream SubscribeWireLogResponse) {}
}
