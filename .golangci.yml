version: "2"
# QUM-1289: build tags golangci-lint must resolve, or it silently skips the files
# behind them. cmd/skills_doclint_test.go sits behind `doclint` (its two
# documentation-linter tests cost 37.5s of ./cmd's 43.5s under -race, so they
# were moved out of the default test binary). Without this, `make lint` reported
# "0 issues" on a file containing a genuine `declared and not used` compile
# error — verified by planting one: `go vet -tags doclint` caught it, default
# lint did not, `--build-tags doclint` did. A tag that hides code from the
# linter is the same defect class as a tag that hides a test from the runner.
run:
  build-tags:
    - doclint
linters:
  default: standard
  enable:
    - errorlint
    - gocritic
    - gosec
    - misspell
    - revive
    - unconvert
    - unparam
  exclusions:
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      # Test files: relax errcheck, unparam, gosec, revive export/package comments
      - path: _test\.go
        linters:
          - errcheck
          - unparam
          - gosec
      - path: _test\.go
        linters:
          - revive
        text: "unused-parameter"
      # Package comments are low-value for internal packages
      - linters:
          - revive
        text: "package-comments"
      # Exported comment requirements too noisy for now
      - linters:
          - revive
        text: "exported:"
formatters:
  enable:
    - gofumpt
    - goimports
