# Ceiling for the in-tree always-loaded instruction budget, in lines, enforced
# by scripts/always-loaded-budget.sh.
#
# This file is NOT the mechanism. A number in a config file is still a hardcoded
# number, and moving the figure out of prose changes nothing on its own — what
# makes it different from the four figures this tool replaces is that the script
# derives the measured total and FAILS when it crosses this bound. The file just
# makes the bound reviewable in a diff.
#
# Caveat on the unit, from the audit's own appendix E: `wc -l`-style line counts
# move under reflow without anything that matters changing. The report prints
# lines, words and chars per file; lines is enforced because it is the audit's
# vocabulary. If the ceiling starts getting gamed by reformatting, switch the
# enforced metric to chars rather than raising this.
#
# 250 is the audit's recommendation for the post-cut tree (a ~170-line CLAUDE.md
# plus the doubly-injected workspace config). The tree does not meet it today —
# see docs/audits/2026-08-06-docs-restructure/budget-resolver.md.
CEILING=250
