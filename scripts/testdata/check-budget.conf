# check-budget.conf (QUM-1289)
#
# Declared per-step budgets for `make check`, in whole seconds. EVERY step in
# CHECK_STEPS must appear here or `check` fails: that is the mechanism which
# stops the commit gate growing back into the merge gate one addition at a time.
#
# These are DECLARATIONS, not measurements — a ceiling each step promises to stay
# under, deliberately a little above what it costs today so ordinary host noise
# does not require edits. Measured on an 8-core arm64 host, 2026-08-23:
#
#   build 1.48  hooks-armed 0.37  always-loaded-budget 0.51  test-race-gate 1.67
#   scoped lint 0.91 (10-package closure, warm cache)
#
# check-test-race is the big one and it is change-dependent by design: a small
# closure is a few seconds, while a commit touching internal/supervisor pays
# that package's ~50s (tracked by QUM-1307). The declaration is what a HEALTHY
# scoped run should cost; the wall-clock band warns loudly when reality exceeds
# it, and does not block.
#
# Do NOT raise a number here to make a slow step fit. Make it faster, or move it
# to the merge gate — the rule above CHECK_STEPS in the Makefile decides which.
check-budget-structural 1
build 4
hooks-armed 1
check-fmt 5
check-lint 9
always-loaded-budget 1
test-race-gate 3
check-test-race 21
